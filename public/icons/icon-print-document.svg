<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" fill="none">
  <!-- Nano Official Document & Consent Printer Icon -->
  <!-- Top Document (Sheet with Medical Cross & Gold Seal) -->
  <path d="M 8 13 L 8 4 C 8 3, 9 2.5, 10 2.5 L 19 2.5 L 24 7.5 L 24 13 Z" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5" />
  <path d="M 19 2.5 L 19 7.5 L 24 7.5" fill="#E2E8F0" stroke="#0F172A" stroke-width="1" />

  <!-- Medical Cross / Clinic Emblem on Doc -->
  <rect x="11.5" y="5" width="2" height="5" rx="0.5" fill="#EF4444" />
  <rect x="10" y="6.5" width="5" height="2" rx="0.5" fill="#EF4444" />

  <!-- Document Lines -->
  <line x1="16.5" y1="6" x2="20" y2="6" stroke="#1D4ED8" stroke-width="1.2" stroke-linecap="round" />
  <line x1="16.5" y1="8" x2="21" y2="8" stroke="#64748B" stroke-width="1" stroke-linecap="round" />
  <line x1="11" y1="11" x2="21" y2="11" stroke="#64748B" stroke-width="1" stroke-linecap="round" />

  <!-- Printer Base Body (Deep Royal Navy) -->
  <rect x="4" y="12" width="24" height="14" rx="3" fill="#1E3A8A" stroke="#0F172A" stroke-width="1.5" />
  
  <!-- Output Tray -->
  <rect x="7" y="19" width="18" height="8" rx="1.5" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.3" />
  <line x1="10" y1="22" x2="22" y2="22" stroke="#3B82F6" stroke-width="1.2" stroke-linecap="round" />
  <line x1="10" y1="24.5" x2="17" y2="24.5" stroke="#64748B" stroke-width="1" stroke-linecap="round" />

  <!-- Golden Paw Badge on Paper Bottom Corner -->
  <circle cx="21.5" cy="24.5" r="1.8" fill="#F59E0B" />
  <circle cx="21.5" cy="24.7" r="0.6" fill="#FFFFFF" />

  <!-- Status Light -->
  <circle cx="24" cy="15.5" r="1.3" fill="#10B981" />
</svg>
