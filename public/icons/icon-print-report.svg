<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" fill="none">
  <!-- Nano Financial & Operational Report Printer Icon -->
  <!-- Top Document with Bar Chart Graphics -->
  <path d="M 8 13 L 8 4 C 8 3, 9 2.5, 10 2.5 L 18.5 2.5 L 24 8 L 24 13 Z" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5" />
  <path d="M 18.5 2.5 L 18.5 8 L 24 8" fill="#E2E8F0" stroke="#0F172A" stroke-width="1" />

  <!-- Bar Chart Columns on Report Document -->
  <rect x="11" y="9" width="2" height="3" rx="0.5" fill="#3B82F6" />
  <rect x="14" y="7" width="2" height="5" rx="0.5" fill="#10B981" />
  <rect x="17" y="5" width="2" height="7" rx="0.5" fill="#F59E0B" />
  <rect x="20" y="8" width="2" height="4" rx="0.5" fill="#6366F1" />

  <!-- Printer Base Body (Indigo-Blue) -->
  <rect x="4" y="12" width="24" height="14" rx="3" fill="#1E40AF" stroke="#0F172A" stroke-width="1.5" />
  
  <!-- Output Tray -->
  <rect x="7" y="19" width="18" height="8" rx="1.5" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.3" />
  <line x1="10" y1="22" x2="22" y2="22" stroke="#1E40AF" stroke-width="1.2" stroke-linecap="round" />
  <line x1="10" y1="24.5" x2="16" y2="24.5" stroke="#F59E0B" stroke-width="1.2" stroke-linecap="round" />

  <!-- Nano Golden Paw Badge on Paper Bottom Corner -->
  <circle cx="21" cy="24.5" r="1.8" fill="#F59E0B" />

  <!-- Status Light -->
  <circle cx="24" cy="15.5" r="1.3" fill="#10B981" />
</svg>
