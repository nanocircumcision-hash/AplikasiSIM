<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" fill="none">
  <!-- Nano Thermal Receipt Printer Icon -->
  <!-- Printer Base Body -->
  <rect x="4" y="12" width="24" height="15" rx="3.5" fill="#1E3A8A" stroke="#0F172A" stroke-width="1.5" />
  <rect x="7" y="21" width="18" height="3.5" rx="1.5" fill="#0F172A" />
  
  <!-- LED Status Light & Buttons -->
  <circle cx="23" cy="16" r="1.2" fill="#10B981" />
  <circle cx="19.5" cy="16" r="1.2" fill="#F59E0B" />

  <!-- Thermal Paper Roll / Output -->
  <path d="M 8 13 L 8 4.5 C 8 3.5, 9 3, 10 3 L 22 3 C 23 3, 24 3.5, 24 4.5 L 24 13 Z" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5" />
  
  <!-- Receipt Content Lines -->
  <line x1="11" y1="5.5" x2="21" y2="5.5" stroke="#334155" stroke-width="1" stroke-linecap="round" />
  <line x1="11" y1="7.5" x2="18" y2="7.5" stroke="#64748B" stroke-width="1" stroke-linecap="round" />
  <line x1="11" y1="9.5" x2="20" y2="9.5" stroke="#334155" stroke-width="1" stroke-linecap="round" />

  <!-- Nano Golden Paw Stamp on Receipt -->
  <circle cx="16" cy="17" r="2.8" fill="#F59E0B" stroke="#B45309" stroke-width="0.6" />
  <circle cx="16" cy="17.4" r="1" fill="#FFFFFF" />
  <circle cx="14.8" cy="16.2" r="0.4" fill="#FFFFFF" />
  <circle cx="15.6" cy="15.8" r="0.4" fill="#FFFFFF" />
  <circle cx="16.4" cy="15.8" r="0.4" fill="#FFFFFF" />
  <circle cx="17.2" cy="16.2" r="0.4" fill="#FFFFFF" />

  <!-- Output Tray Slot -->
  <line x1="7" y1="12.5" x2="25" y2="12.5" stroke="#0F172A" stroke-width="1.5" />
</svg>
