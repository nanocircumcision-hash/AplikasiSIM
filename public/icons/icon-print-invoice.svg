<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%" fill="none">
  <!-- Nano Invoice Printer Icon -->
  <!-- Top Document (Invoice with Rp badge & lines) -->
  <path d="M 8 13 L 8 4 C 8 3, 9 2.5, 10 2.5 L 18.5 2.5 L 24 8 L 24 13 Z" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5" />
  <path d="M 18.5 2.5 L 18.5 8 L 24 8" fill="#E2E8F0" stroke="#0F172A" stroke-width="1" />
  
  <!-- Invoice Table Lines -->
  <line x1="11" y1="5.5" x2="16" y2="5.5" stroke="#1E40AF" stroke-width="1.2" stroke-linecap="round" />
  <line x1="11" y1="8" x2="17" y2="8" stroke="#64748B" stroke-width="1" stroke-linecap="round" />
  <line x1="11" y1="10.5" x2="21" y2="10.5" stroke="#64748B" stroke-width="1" stroke-linecap="round" />

  <!-- Printer Base Body (Royal Blue) -->
  <rect x="4" y="12" width="24" height="14" rx="3" fill="#1D4ED8" stroke="#0F172A" stroke-width="1.5" />
  
  <!-- Paper Output Tray -->
  <rect x="7" y="19" width="18" height="8" rx="1.5" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.3" />
  <line x1="10" y1="22" x2="22" y2="22" stroke="#10B981" stroke-width="1.2" stroke-linecap="round" />
  <line x1="10" y1="24.5" x2="18" y2="24.5" stroke="#64748B" stroke-width="1" stroke-linecap="round" />

  <!-- Nano Paw Accent / Stamp on Printer Front -->
  <circle cx="24" cy="15.5" r="1.8" fill="#F59E0B" />
  <circle cx="20.5" cy="15.5" r="1" fill="#10B981" />
</svg>
